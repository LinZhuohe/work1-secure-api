name: CI - Security Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run API unit tests
        run: python -m unittest test_api -v

      - name: SAST - Bandit scan
        run: |
          mkdir -p reports
          bandit -r app.py auth_utils.py models.py security.py test_api.py -f html -o reports/bandit.html

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit.html

      - name: SCA - OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "work1-secure-api"
          path: "."
          format: "HTML"
          out: "reports"
          args: >
            --scan requirements.txt

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html
